# Dataset v3 -- the final development dataset.
#
# See docs/dataset_v3_spec.md for the reasoning behind every number here.
#
# v3 replaces Dataset V2 as the training/validation corpus. It does NOT edit
# Dataset V2, Model v1, Policy v1 or Blind v1.1, and it does not touch any
# file inside the Blind v1.1 freeze bundle.
#
# Behaviour is declared as LATENT PARAMETER RANGES, never as a label or a
# feature value. Ranges overlap between populations on purpose.

dataset_name: development-v3
generator_version: dataset-v3-1
spec_version: v3
currency: INR

# --------------------------------------------------------------------------
# merchants
# --------------------------------------------------------------------------
# `login_affinity` scales how likely a shopper at this merchant is signed in.
# A subscription service is nearly always an account; a flash sale is not.
# It is a property of the business, never of the actor, and merchant kind is
# still not a model feature.
#
# v3 fix (M5): every declared kind gets at least one instance. Dataset V2 and
# Blind v1.0 sampled kinds WITH REPLACEMENT and silently lost `travel`.
merchants:
  seed: 60700411
  count: 16
  campaign_calendar:
    start: 2026-01-01T00:00:00+00:00
    days: 420
    window_days: [1.5, 5.0]
  kinds:
    small_ecommerce:
      weight: 4
      login_affinity: 0.85
      typical_amount: [700, 2600]
      amount_spread: [0.55, 0.85]
      base_success_rate: [0.94, 0.98]
      campaign_share: [0.03, 0.10]
      returning_customer_rate: [0.25, 0.45]
      shared_ip_pressure: [0.05, 0.15]
    digital_goods:
      weight: 3
      login_affinity: 1.00
      typical_amount: [60, 340]
      amount_spread: [0.90, 1.35]
      base_success_rate: [0.94, 0.98]
      campaign_share: [0.05, 0.15]
      returning_customer_rate: [0.35, 0.60]
      shared_ip_pressure: [0.08, 0.20]
    subscription:
      weight: 2
      login_affinity: 1.15            # an account is required to subscribe
      typical_amount: [199, 899]
      amount_spread: [0.30, 0.50]
      base_success_rate: [0.92, 0.97]
      campaign_share: [0.0, 0.02]
      returning_customer_rate: [0.55, 0.80]
      shared_ip_pressure: [0.05, 0.12]
    electronics:
      weight: 2
      login_affinity: 0.75
      typical_amount: [6000, 42000]
      amount_spread: [0.70, 1.05]
      base_success_rate: [0.90, 0.96]
      campaign_share: [0.06, 0.18]
      returning_customer_rate: [0.10, 0.25]
      shared_ip_pressure: [0.04, 0.12]
    education:
      weight: 2
      login_affinity: 1.05
      typical_amount: [900, 14000]
      amount_spread: [0.80, 1.20]
      base_success_rate: [0.92, 0.97]
      campaign_share: [0.02, 0.08]
      returning_customer_rate: [0.15, 0.35]
      shared_ip_pressure: [0.25, 0.55]   # campus / institutional networks
    flash_sale:
      weight: 2
      login_affinity: 0.60            # guest checkout dominates a drop
      typical_amount: [400, 2200]
      amount_spread: [0.60, 0.95]
      base_success_rate: [0.87, 0.94]
      campaign_share: [0.30, 0.55]
      returning_customer_rate: [0.20, 0.40]
      shared_ip_pressure: [0.20, 0.45]
    travel:
      weight: 1
      login_affinity: 0.70
      typical_amount: [3500, 28000]
      amount_spread: [0.75, 1.10]
      base_success_rate: [0.89, 0.95]
      campaign_share: [0.04, 0.12]
      returning_customer_rate: [0.08, 0.20]
      shared_ip_pressure: [0.05, 0.15]

# --------------------------------------------------------------------------
# customers -- persistent identities (v3 fix M1)
# --------------------------------------------------------------------------
# A customer joins once and persists for the rest of the window. Tenure and
# history EMERGE from the episodes actually generated after `joined_at`;
# nothing is injected as a prior count.
customers:
  # Customers join in the first fraction of the window, so an early joiner
  # accumulates real history before its later episodes.
  join_window_fraction: 0.62
  # Per-customer propensity to be signed in. Combined multiplicatively with
  # the scenario multiplier and the merchant affinity, then clipped.
  login_propensity: [0.35, 1.00]
  home_ips: [1, 3]
  # Chance a customer's traffic egresses through the shared pool regardless
  # of scenario (household behind CGNAT, office worker, campus).
  shared_ip_probability: 0.16

# --------------------------------------------------------------------------
# latent behaviour defaults
# --------------------------------------------------------------------------
scenario_defaults:
  episodes: [1, 1]
  episode_gap_days: [0.5, 3.0]
  attempts: [1, 4]                    # per EPISODE
  gap_seconds: [40, 900]
  gap_spread: [0.5, 1.1]
  method_validity: [0.75, 0.95]
  network_instability: [0.01, 0.05]
  session_rotation: [0.02, 0.12]
  ip_rotation: [0.02, 0.10]
  instrument_reuse: [0.75, 0.95]
  checkout_completion: [0.70, 0.95]
  continue_after_success: [0.05, 0.25]
  devices: [1, 1]                     # devices this actor uses
  device_mode: sticky                 # sticky | spread
  customers_on_device: [1, 1]
  ip_pool: private                    # private | shared | mobile
  login_multiplier: [0.8, 1.2]
  guest: false
  prefers_campaign: false
  amount_style_weights:
    merchant_typical: 0.80
    repeat: 0.14
    low: 0.03
    varied: 0.03
  phases: []

