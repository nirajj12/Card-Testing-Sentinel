# --------------------------------------------------------------------------
# instruments / identity
# --------------------------------------------------------------------------
instruments:
  last4_pool: 2600
  networks: [visa, mastercard, rupay, amex, diners, other]
  network_weights: [0.38, 0.27, 0.25, 0.05, 0.02, 0.03]
  types: [credit, debit, prepaid, unknown]
  type_weights: [0.30, 0.54, 0.12, 0.04]
  issuers: 30
  international_rate: 0.08
  methods: [card, upi, netbanking, wallet]
  method_weights: [0.55, 0.30, 0.07, 0.08]

identity:
  shared_ip_pool: 110
  mobile_ip_pool: 900                 # carrier NAT churn: many, rarely reused
  outcome_lag_seconds: [1, 6]
  checkout_lag_seconds: [8, 240]

# --------------------------------------------------------------------------
# splits -- disjoint devices, customers, IPs AND time
# --------------------------------------------------------------------------
splits:
  train:
    seed: 31415926
    devices: 7000
    benchmark_attack_device_fraction: 0.16
    start: 2026-01-05T00:00:00+00:00
    days: 120                         # long enough for real 30d history
  validation:
    seed: 27182818
    devices: 2600
    benchmark_attack_device_fraction: 0.18
    starts_after_train_gap_days: 4
    days: 60
    shift:
      gap_multiplier: 1.20
      amount_multiplier: 1.12
      attempts_bonus: 1

# --------------------------------------------------------------------------
# gates
# --------------------------------------------------------------------------
gates:
  max_univariate_f1: 0.85
  max_shuffled_label_roc_auc: 0.60
  min_overlap_coefficient: 0.25
  min_scenario_devices: 20
  min_scenario_requests: 40
  max_scenario_request_share: 0.30
  legitimate_decline_rate:
    fail_below: 0.05
    warn_below: 0.10
    warn_above: 0.28
    fail_above: 0.35
  ordinary_legitimate_scenarios:
    - returning_customer_multi_episode
    - cold_start_guest
    - logged_in_new_customer
    - multi_device_customer
    - shared_network_customer
    - micro_payment_customer
  # v3-specific gates
  customer_id_presence:
    overall_min: 0.55
    overall_max: 0.75
    max_population_gap: 0.15
    max_single_feature_f1: 0.65
  multi_device_customers:
    min_per_population: 25
    max_population_share: 0.85
  long_horizon:
    min_span_days: 3.0
    min_device_share_per_population: 0.15
