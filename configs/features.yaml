version: merchant-visible-causal-1

# Every feature below is computable from information a merchant genuinely has
# at the moment it calls Sentinel -- before it creates a Razorpay order:
#   * the raw facts on the current request (device/session/ip/amount/campaign)
#   * this device's OWN earlier requests (timestamps, ip, amount)
#   * this device's earlier VERIFIED payment outcomes (approved/declined +
#     the card/method metadata Razorpay reports afterwards)
# Nothing here uses the current attempt's card, method, or outcome.
#
# Card metadata features are deliberately weak and few: `last4`/`network`
# collide, and are only known post-hoc, so they are supporting signals --
# never the dominant one.

maximum_history_days: 7
shuffled_label_max_roc_auc: 0.60
one_feature_max_f1: 0.85

features:
  # request velocity -- from this device's prior committed requests
  - requests_10s
  - requests_60s
  - requests_5m
  - requests_24h
  - requests_per_ip_5m
  - devices_per_ip_24h
  - seconds_since_last_request
  - ip_changes_24h
  # device / session shape
  - device_age_seconds
  - is_new_device
  - session_age_seconds
  - sessions_24h
  - ip_rotation_ratio_24h
  # verified historical outcomes -- prior attempts only
  - prior_payments_24h
  - recent_failures_24h
  - failure_ratio_24h
  - decline_streak
  - successful_checkouts
  - seconds_since_last_payment
  - seconds_since_last_success
  - retry_after_decline_ratio_24h
  # amount behaviour -- merchant-visible request amounts
  - current_amount
  - amount_delta
  - amount_variation_24h
  - low_amount_ratio_24h
  # weak historical payment metadata -- from verified outcomes only
  - distinct_card_last4_7d
  - distinct_card_networks_7d
  - card_change_after_decline_7d
