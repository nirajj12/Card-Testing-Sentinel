    weight: 12   # v1.1: was 10
    attempts: [1, 4]
    gap_seconds: [15, 400]
    method_validity: [0.80, 0.96]
    ip_pool: shared
    session_rotation: [0.05, 0.20]
    checkout_completion: [0.78, 0.95]
    merchant_kinds: [ticketing_events, education, flash_sale]

  campaign_rush:
    population: legitimate
    weight: 5   # v1.1: was 8
    attempts: [2, 8]
    gap_seconds: [4, 70]              # sharper than development's flash rush
    gap_spread: [0.3, 0.9]
    method_validity: [0.78, 0.95]
    network_instability: [0.12, 0.32]
    ip_pool: shared
    prefers_campaign: true
