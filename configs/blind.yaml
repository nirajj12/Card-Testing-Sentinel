# Blind benchmark v1.1 — configuration.
#
# Frozen before generation. See docs/blind_spec.md for the reasoning behind
# every number here.
#
# REVISION v1.1 (pre-evaluation). v1.0 was generated and FAILED its own
# pre-evaluation validation. No model score, policy decision, recall,
# precision, PR-AUC, FPR or any other blind performance result was observed
# before this revision was frozen. The corrections are objective generation
# defects only -- see docs/blind_spec.md §13.
#
# This file is NOT a copy of training.yaml with a new seed. It declares its
# own merchants (including three archetypes that did not exist during
# development), its own twenty scenario families, its own time window and its
# own shift ranges.
#
# INDEPENDENCE: nothing below is derived from a model coefficient, a feature
# importance, a policy threshold, or any development/validation result. No
# value here was chosen by measuring the frozen system's response to it.

blind_version: v1.1
dataset_name: blind-v1.1
generator_version: blind-generator-2
currency: INR

# Unrelated to every development seed (train 20260101, validation 771103,
# merchants 4242001, training 20260401).
seed: 90210007

# ── time window ──────────────────────────────────────────────────────────
# Development validation's last event is in late June 2026. Blind opens well
# after it; the generator asserts strict separation against the development
# manifest at generation time and refuses to write on overlap.
window:
  start: 2026-09-01T00:00:00+00:00
  # v1.1: renamed from `days`. This bounds when actors BEGIN, not when the
  # benchmark ends. ultra_patient_tester, sparse_multiday and
  # dormant_returning_customer deliberately run for days-to-months after their
  # start, so the realized event span is longer. Truncating them to force
  # every event inside the window would delete the long-horizon behaviour the
  # benchmark exists to test.
  actor_start_window_days: 60
  # Hard floor: generation fails if any blind event lands before this.
  must_start_after: 2026-07-15T00:00:00+00:00

population:
  devices: 3000
  # A SAMPLING CHOICE so all ten attack families carry enough devices to
  # report per-family recall -- not an estimate of real card-testing
  # prevalence. Any precision computed here is `benchmark_precision`.
  #
  # v1.1: renamed from `benchmark_attack_fraction` and now applied at DEVICE
  # level, because the evaluation is device-level. In v1.0 it was applied when
  # drawing an actor; blind attack actors own 4-9 devices each, so the realized
  # device prevalence came out at 0.291 instead of 0.20.
  benchmark_attack_device_fraction: 0.20

# ── merchants ────────────────────────────────────────────────────────────
# All instances are new. Ten kinds are declared: seven known kinds re-drawn
# with shifted parameters, and three kinds that did not exist in development
# at all. `merchant_kind` is not a model feature, so an unseen kind tests
# behavioural generalisation rather than a missing lookup key.
#
# v1.1: EVERY declared kind is realized. `count` (11) is the number of merchant
# INSTANCES; each of the ten kinds gets one instance and the remaining slot is
# drawn by weight. v1.0 sampled all eleven slots by weight with replacement,
# which left flash_sale, travel and ticketing_events -- including one of the
# three unseen archetypes -- with zero merchants and zero devices.
merchants:
  seed: 55501234
  count: 11
  campaign_calendar:
    start: 2026-08-01T00:00:00+00:00
    days: 200
    # Shorter, sharper campaigns than development's [1.5, 5.0] days.
    window_days: [0.5, 3.0]
  kinds:
    # -- known kinds, new instances, shifted parameters -------------------
    small_ecommerce:
      origin: known
      weight: 3
      typical_amount: [850, 3200]        # dev [700, 2600]
      amount_spread: [0.70, 1.05]        # dev [0.55, 0.85] -- wider
      base_success_rate: [0.90, 0.96]    # dev [0.94, 0.98] -- slightly lower
      campaign_share: [0.04, 0.14]
      returning_customer_rate: [0.20, 0.45]
      shared_ip_pressure: [0.08, 0.22]
    digital_goods:
      origin: known
      weight: 2
      typical_amount: [90, 480]
      amount_spread: [1.00, 1.45]
      base_success_rate: [0.91, 0.97]
      campaign_share: [0.06, 0.18]
      returning_customer_rate: [0.35, 0.62]
      shared_ip_pressure: [0.10, 0.26]
    subscription:
      origin: known
      weight: 2
      typical_amount: [149, 1200]
      amount_spread: [0.35, 0.65]
      base_success_rate: [0.86, 0.94]
      campaign_share: [0.0, 0.03]
      returning_customer_rate: [0.55, 0.82]
      shared_ip_pressure: [0.05, 0.15]
    electronics:
      origin: known
      weight: 2
      typical_amount: [5000, 55000]
      amount_spread: [0.80, 1.20]
      base_success_rate: [0.84, 0.93]
      campaign_share: [0.08, 0.22]
      returning_customer_rate: [0.08, 0.24]
      shared_ip_pressure: [0.05, 0.15]
    education:
      origin: known
      weight: 2
      typical_amount: [700, 18000]
      amount_spread: [0.90, 1.30]
      base_success_rate: [0.86, 0.94]
      campaign_share: [0.02, 0.10]
      returning_customer_rate: [0.12, 0.35]
      shared_ip_pressure: [0.30, 0.62]
    flash_sale:
      origin: known
      weight: 2
      typical_amount: [350, 2600]
      amount_spread: [0.70, 1.10]
      base_success_rate: [0.80, 0.91]
      campaign_share: [0.35, 0.60]
      returning_customer_rate: [0.18, 0.42]
      shared_ip_pressure: [0.25, 0.50]
    travel:
      origin: known
      weight: 1
      typical_amount: [4000, 36000]
      amount_spread: [0.85, 1.20]
      base_success_rate: [0.83, 0.92]
      campaign_share: [0.04, 0.14]
      returning_customer_rate: [0.06, 0.20]
      shared_ip_pressure: [0.06, 0.18]

    # -- unseen kinds: absent from development ----------------------------
    ticketing_events:
      origin: unseen
      weight: 2
      # On-sale moments: violent short bursts, heavy venue/office egress.
      typical_amount: [600, 9000]
      amount_spread: [0.75, 1.15]
      base_success_rate: [0.79, 0.90]
      campaign_share: [0.30, 0.55]
      returning_customer_rate: [0.10, 0.30]
      shared_ip_pressure: [0.45, 0.80]
    food_delivery:
      origin: unseen
      weight: 2
      # Very frequent small baskets, mobile-heavy so IPs churn constantly.
      typical_amount: [120, 900]
      amount_spread: [0.55, 0.90]
      base_success_rate: [0.89, 0.96]
      campaign_share: [0.05, 0.16]
      returning_customer_rate: [0.65, 0.90]
      shared_ip_pressure: [0.30, 0.55]
    gaming_topups:
      origin: unseen
      weight: 2
      # Micro-payments in rapid succession from returning users: legitimate
      # traffic whose velocity and amount profile structurally resembles
      # card testing. The sharpest generalisation test in the set.
      typical_amount: [20, 400]
      amount_spread: [1.10, 1.60]
      base_success_rate: [0.88, 0.96]
      campaign_share: [0.08, 0.20]
      returning_customer_rate: [0.70, 0.92]
      shared_ip_pressure: [0.20, 0.45]

# ── latent behaviour defaults ────────────────────────────────────────────
# Same schema as development so the neutral primitives can be reused, but the
# values differ. As before, a scenario declares RANGES; every observable is
# drawn from them. No branch anywhere keys on the label.
scenario_defaults:
  attempts: [1, 4]
  gap_seconds: [60, 1200]
  gap_spread: [0.6, 1.3]              # dev [0.5, 1.1] -- more variable
  method_validity: [0.72, 0.94]
  network_instability: [0.02, 0.07]
  session_rotation: [0.03, 0.15]
  ip_rotation: [0.03, 0.14]
  instrument_reuse: [0.72, 0.94]
  checkout_completion: [0.68, 0.95]
  continue_after_success: [0.05, 0.30]
  device_pool: [1, 1]
  customer_pool: [1, 1]
  ip_pool: private
  amount_style_weights:
    merchant_typical: 0.76
    repeat: 0.14
    low: 0.04
    varied: 0.04
    high: 0.02
  phases: []
  # Blind-only mechanics (absent from the development generator):
  dormant_gap_days: [0, 0]            # long initial inactivity before returning
  burst_pause: null                   # alternating fast/slow blocks

# ── legitimate families (10) ─────────────────────────────────────────────
#
# v1.1 MIXTURE CORRECTION. v1.0 generated a legitimate decline rate of 0.4179,
# and 0.4384 after the merchant fix -- both above this config's own
# plausibility ceiling of 0.40. No merchant's approval rate was raised and no
# family's behaviour was softened: `persistent_genuine_failures` still draws
# `method_validity: [0.15, 0.45]` and still declines ~80% of the time. Only
# POPULATION SHARE changed, so the hard tails stay genuinely hard but stop
# dominating a merchant's book. Every changed weight is annotated inline with
# its v1.0 value.
#
# The corrected aggregate still sits above the comfortable band [0.10, 0.30]
# and the validator still warns about it. That is left standing rather than
# tuned away: blind merchants were deliberately given lower approval bands
# (§7 of the spec), and the campaign families now correctly run on
# campaign-heavy merchants whose base success rate is the lowest in the set.
# Part of the elevation is a declared shift, not a mixture error.
scenarios:

  cold_start_wave:
    population: legitimate
    weight: 30
    attempts: [1, 2]
    gap_seconds: [45, 900]
    method_validity: [0.82, 0.97]
    checkout_completion: [0.62, 0.92]

  persistent_genuine_failures:
    population: legitimate
    weight: 3   # v1.1: was 6
    attempts: [3, 8]
    gap_seconds: [90, 5400]           # dev rgf [25, 900] -- longer, irregular
    gap_spread: [0.9, 1.6]
    method_validity: [0.15, 0.45]
    network_instability: [0.05, 0.16]
    instrument_reuse: [0.40, 0.78]
    session_rotation: [0.10, 0.35]
    ip_rotation: [0.12, 0.40]
    checkout_completion: [0.70, 0.92]

  unstable_connection_retries:
    population: legitimate
    weight: 3   # v1.1: was 6
    attempts: [3, 9]
    gap_seconds: [8, 120]             # dev storm [4, 45] -- different cadence
    gap_spread: [0.4, 1.0]
    method_validity: [0.80, 0.96]
    network_instability: [0.20, 0.42]
    instrument_reuse: [0.86, 0.99]
    session_rotation: [0.20, 0.50]
    checkout_completion: [0.72, 0.94]

  event_venue_burst:
