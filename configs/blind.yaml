# ── instruments / identity ───────────────────────────────────────────────
instruments:
  last4_pool: 2600
  networks: [visa, mastercard, rupay, amex, diners, other]
  network_weights: [0.38, 0.27, 0.25, 0.05, 0.02, 0.03]
  types: [credit, debit, prepaid, unknown]
  type_weights: [0.30, 0.54, 0.12, 0.04]
  issuers: 30
  international_rate: 0.09
  methods: [card, upi, netbanking, wallet]
  method_weights: [0.55, 0.30, 0.07, 0.08]

identity:
  shared_ip_pool: 70                  # smaller pool -> denser shared-IP traffic
  outcome_lag_seconds: [1, 8]
  checkout_lag_seconds: [10, 300]

# ── validation gates ─────────────────────────────────────────────────────
# Same *kinds* of gate as development, but the blind set is deliberately
# shifted, so the overlap floor is lower. These are integrity gates, not
# performance targets.
gates:
  max_univariate_f1: 0.85
  max_shuffled_label_roc_auc: 0.60
  min_overlap_coefficient: 0.20
  min_scenario_devices: 20
  min_scenario_requests: 40
  max_scenario_request_share: 0.30
  legitimate_decline_rate:
    fail_below: 0.05
    warn_below: 0.10
    warn_above: 0.30
    fail_above: 0.40
  ordinary_legitimate_scenarios:
    - cold_start_wave
    - dormant_returning_customer
    - multi_session_comparison_shopper
    - event_venue_burst
    - mobile_network_churn
