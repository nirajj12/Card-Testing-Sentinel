version: v2-phase2-training-1
seed: 20260825
folds: 5
probability_tolerance: 1.0e-12
ece_bins: 10
primary_legitimate_intervention_rate: 0.03
model_features:
  remove:
    prior_attempts_10s: >-
      Training-only Pearson correlation with prospective_requests_10s exceeds
      0.98; the prospective count includes the current request and is the live
      precheck quantity the policy needs.
    prior_attempts_60s: >-
      Training-only Pearson correlation with prospective_requests_60s exceeds
      0.99; retaining both adds no useful independent information.
candidate_grids:
  logistic_regression:
    C: [0.1, 1.0, 10.0]
    max_iter: 500
  hist_gradient_boosting:
    - learning_rate: 0.05
      max_leaf_nodes: 15
      max_iter: 120
      l2_regularization: 1.0
    - learning_rate: 0.08
      max_leaf_nodes: 15
      max_iter: 160
      l2_regularization: 2.0
    - learning_rate: 0.05
      max_leaf_nodes: 31
      max_iter: 160
      l2_regularization: 4.0
calibration_methods: [none, sigmoid, isotonic]
calibration_device_fraction: 0.20
calibration_minimum_positive_devices: 50
diagnostic_review_rates: [0.01, 0.03, 0.05]
ranking_objective:
  - passes_integrity_gates
  - worst_subtype_review_or_higher_coverage_at_primary_budget
  - macro_subtype_review_or_higher_coverage_at_primary_budget
  - device_weighted_pr_auc
  - negative_brier_score
  - lower_inference_cost_then_simpler_family
calibration_objective:
  - lowest_device_weighted_brier
  - lowest_expected_calibration_error
  - lowest_log_loss
  - no_material_pr_auc_degradation
  - simpler_method

