version: v2b-causal-features-1
scoring_moment: pre_authorization_before_current_outcome
numeric_tolerance: 1.0e-12
features:
  prior_attempts_14d:
    dtype: float64
    scope: device
    window: 14d
    interval: "[current_timestamp - 14d, current_timestamp)"
    current_request_included: false
    missing_history: 0
    updated_by: authorization_outcome
  distinct_cards_14d:
    dtype: float64
    scope: device
    window: 14d
    interval: "[current_timestamp - 14d, current_timestamp) plus current request"
    current_request_included: true
    missing_history: current_request_card_counts_as_one
    updated_by: authorization_outcome
  amount_continuity_score_30d:
    dtype: float64
    scope: device
    window: 30d
    interval: "[current_timestamp - 30d, current_timestamp)"
    current_request_included: numerator_only
    missing_history: 0_with_amount_continuity_history_available_0
    updated_by: authorization_outcome
  amount_continuity_history_available:
    dtype: float64
    scope: device
    window: 30d
    interval: "[current_timestamp - 30d, current_timestamp)"
    current_request_included: false
    missing_history: 0
    updated_by: authorization_outcome
  ip_rotation_ratio_24h:
    dtype: float64
    scope: device_and_ip
    window: 24h
    interval: "[current_timestamp - 24h, current_timestamp) plus current request"
    current_request_included: true
    missing_history: 1
    updated_by: authorization_outcome
  checkout_completion_lag_seconds:
    dtype: float64
    scope: device
    window: all_prior_committed_history
    interval: "strictly before current scoring order"
    current_request_included: false
    missing_history: 0_with_checkout_completion_lag_available_0
    updated_by: checkout_completion
  checkout_completion_lag_available:
    dtype: float64
    scope: device
    window: all_prior_committed_history
    interval: "strictly before current scoring order"
    current_request_included: false
    missing_history: 0
    updated_by: checkout_completion
