# Phase 2B candidate policy grid PROPOSAL (design only -- not executed).
#
# Rationale (see reports/v2/phase2b/phase2b_development_diagnosis.md, question
# 9, and reports/v2/modeling/phase2_final_closeout.md): the Phase 2 closest
# candidates in every family failed on the REVIEW budget for normal_bad_luck
# and flash_hard_retry, not on block. This grid keeps the same three-family
# structure and the same (unchanged, business-owned) budgets, but searches
# more finely in the exact region where Phase 2's closest candidates sat
# (ml_only review 0.35-0.55, rules_only review score 3-5, combined review
# 0.30-0.50) so a Phase 2B run can determine whether a nearby operating point
# becomes feasible once the feature/data changes in this proposal are made --
# without assuming they will.
version: v2-phase2b-policy-grid-proposal-1
families:
  rules_only:
    review_scores: [3, 4, 5]
    block_scores: [5, 6, 7]
  ml_only:
    review_thresholds: [0.35, 0.40, 0.45, 0.50, 0.55]
    block_thresholds: [0.65, 0.75, 0.85, 0.90, 0.95]
  combined:
    review_thresholds: [0.30, 0.35, 0.40, 0.45, 0.50]
    block_thresholds: [0.75, 0.85, 0.90]
    review_scores: [2, 3, 4]
    block_support_scores: [3, 4]
    relationship: >-
      Unchanged from Phase 2: review when either the calibrated probability or
      rule score reaches its review threshold; block only when both calibrated
      probability and rule evidence reach their block/support thresholds.
