  - requests_24h
  - requests_per_ip_5m
  - devices_per_ip_24h
  - seconds_since_last_request
  - ip_changes_24h
  - device_age_seconds
  - is_new_device
  - session_age_seconds
  - sessions_24h
  - ip_rotation_ratio_24h
  - prior_payments_24h
  - recent_failures_24h
  - failure_ratio_24h
  - decline_streak
  - successful_checkouts_30d
  - seconds_since_last_payment
  - seconds_since_last_success
  - retry_after_decline_ratio_24h
  - current_amount
  - amount_delta
  - amount_variation_24h
  - low_amount_ratio_24h
  - distinct_card_last4_7d
  - distinct_card_networks_7d
  - card_change_after_decline_7d
  - requests_7d
  - failures_7d
  - active_day_count_7d
