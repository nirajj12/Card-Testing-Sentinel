name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0
      - run: python -m pip install --no-deps -r requirements-runtime.lock
      - run: python -m pip install --no-deps -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: pytest --cov-report=term-missing --cov-fail-under=80
      - run: python scripts/verify_release.py
