[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "card-testing-sentinel"
version = "1.0.0"
description = "Real-time pre-authorization card-testing detection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "Jinja2==3.1.6",
    "joblib==1.4.2",
    "numpy==1.26.4",
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "PyYAML==6.0.2",
    "scikit-learn==1.6.1",
    "scipy==1.14.1",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "matplotlib==3.11.1",
    "pandas==3.0.5",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=card_testing_sentinel --cov-report=term-missing -m 'not slow'"
testpaths = ["tests"]
markers = [
    "slow: reproducibility, regeneration, or ignored-data-dependent coverage",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
omit = [
    "src/card_testing_sentinel/ml/*",
    "src/card_testing_sentinel/features/batch.py",
    "src/card_testing_sentinel/features/batch_v2.py",
    "src/card_testing_sentinel/features/engine.py",
    "src/card_testing_sentinel/features/specification.py",
    "src/card_testing_sentinel/policy/engine.py",
    "src/card_testing_sentinel/policy/evidence.py",
    "src/card_testing_sentinel/policy/reasons.py",
]
