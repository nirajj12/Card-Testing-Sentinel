[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "card-testing-sentinel"
version = "0.1.0"
description = "Defensive detection of payment card-testing attacks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "mlflow>=3.0,<4",
    "scikit-learn>=1.5,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=card_testing_sentinel --cov-report=term-missing"
markers = ["integration: validates the complete frozen dataset"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
